name: Scrape BPB FREE Plugins

on:
  schedule:
    # 毎日 UTC 1:00 (JST 10:00) と UTC 13:00 (JST 22:00) の2回
    - cron: "0 1 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:  # 手動実行
  push:
    branches: [main]
    paths:
      - "scrape_bpb_free.py"
      - ".github/workflows/scrape_bpb.yml"

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BPB FREE scraper
        run: python scrape_bpb_free.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/free_bpb_history.csv output/free_bpb_latest.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(bpb): update FREE plugin data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
