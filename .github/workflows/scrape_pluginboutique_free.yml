name: Scrape Plugin Boutique FREE Plugins

on:
  schedule:
    # 週1回（毎週月曜 UTC 2:00 = JST 11:00）
    - cron: "0 2 * * 1"
  workflow_dispatch:  # 手動実行
  push:
    branches: [main]
    paths:
      - "scrape_pluginboutique_free.py"
      - ".github/workflows/scrape_pluginboutique_free.yml"

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      - name: Run Plugin Boutique FREE scraper
        run: python scrape_pluginboutique_free.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/free_pluginboutique_history.csv output/free_pluginboutique_latest.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(pb-free): update FREE plugin data ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
