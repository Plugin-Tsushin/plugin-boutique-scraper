name: Scrape Plugin Boutique Deals

on:
  # 毎日UTC 0:00に実行（日本時間 9:00）
  schedule:
    - cron: '0 0 * * *'

  # 手動実行も可能
  workflow_dispatch:

  # プッシュ時にもテスト実行（mainブランチのみ）
  push:
    branches:
      - main
    paths:
      - 'scrape_plugin_boutique.py'
      - 'requirements.txt'
      - '.github/workflows/scrape.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run scraper
        run: python scrape_plugin_boutique.py

      - name: Check if CSV was created
        id: check_csv
        run: |
          if [ -f "output/plugin_data.csv" ]; then
            echo "csv_exists=true" >> $GITHUB_OUTPUT
            echo "CSV file created successfully"
            head -20 output/plugin_data.csv
          else
            echo "csv_exists=false" >> $GITHUB_OUTPUT
            echo "Warning: CSV file was not created"
          fi

      - name: Commit and push changes
        if: steps.check_csv.outputs.csv_exists == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/plugin_data.csv
          # 変更がある場合のみコミット
          git diff --staged --quiet || git commit -m "Update plugin deals data - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

      - name: Upload CSV as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-data-${{ github.run_number }}
          path: output/plugin_data.csv
          retention-days: 30
          if-no-files-found: warn
